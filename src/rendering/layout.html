<sherpa sherpa-component="exception">
  <div class="sherpa-content">
    <header>
      @Sherpa(.Exception.Name)
    </header>

    <div class="content-body">
      <aside>
        @Sherpa(.Exception.Thread)
      </aside>

      <main>
        @Sherpa(.Exception.Source)
      </main>
    </div>
  </div>
</sherpa>
